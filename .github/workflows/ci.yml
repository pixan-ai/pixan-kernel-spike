name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ShellCheck
        run: shellcheck bin/*.sh tests/*.sh
      - name: Docs match the code
        run: bash tests/docs_test.sh
      - name: Workflows are pinned and least-privilege
        run: bash tests/workflows_test.sh
      - name: Policy is valid JSON
        run: jq empty policy/managed-settings.json
      - name: Hadolint
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - name: No secrets committed
        run: "! git ls-files | grep -E '(^|/)\\.env($|\\.)' | grep -v '\\.env\\.example$'"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: pixan-kernel-spike:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Acceptance tests (inside the built image)
        run: |
          for t in start tools policy cron peer; do
            docker run --rm --user 0 --entrypoint bash -v "$PWD/tests:/tests:ro" pixan-kernel-spike:ci "/tests/${t}_test.sh" || exit 1
          done
      # Report-only until the baseline is known: set exit-code: "1" to make fixable HIGH/CRITICAL findings block.
      - name: Vulnerabilities (Trivy)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pixan-kernel-spike:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          output: trivy.txt
      - name: Show the Trivy report in the job summary
        if: always()
        run: |
          { echo '### Trivy: fixable HIGH and CRITICAL (report-only)'; echo '```'; cat trivy.txt 2>/dev/null || echo 'no report'; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
