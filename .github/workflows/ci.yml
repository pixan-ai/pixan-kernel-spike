name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: shellcheck bin/*.sh tests/*.sh
      - name: Docs match the code
        run: bash tests/docs_test.sh
      - name: Policy is valid JSON
        run: jq empty policy/managed-settings.json
      - name: Policy never waits for a person (denyInsteadOfPrompting)
        run: jq -e '.permissions.denyInsteadOfPrompting == true' policy/managed-settings.json
      - name: Hadolint
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
      - name: No secrets committed
        run: "! git ls-files | grep -E '(^|/)\\.env($|\\.)' | grep -v '\\.env\\.example$'"

  build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: pixan-kernel-spike:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Acceptance tests (inside the built image)
        run: |
          for t in start tools policy; do
            docker run --rm --user 0 --entrypoint bash -v "$PWD/tests:/tests:ro" pixan-kernel-spike:ci "/tests/${t}_test.sh" || exit 1
          done
