name: Bug report
description: Something does not behave as documented
body:
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output of bin/screen.sh and bin/denials.sh
      description: Remove tokens, keys and chat ids before pasting.
      render: shell
