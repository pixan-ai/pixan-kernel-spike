services:
  agent:
    build: .
    env_file: .env
    environment:
      TZ: ${TZ:-UTC}
      # Extra flags for claude. Empty = default interactive mode (auto mode, with the classifier).
      CLAUDE_FLAGS: ${CLAUDE_FLAGS:-}
    volumes:
      - data:/data
    restart: unless-stopped
    mem_limit: ${MEM_LIMIT:-4g}  # a long session grows; a cap turns a leak into a restart instead of a bill
    init: true
volumes:
  data:
